; Export presets for the Concord World Lens (Godot 4.4).
;
; Normally this file is generated by the editor's Project > Export dialog. It is
; hand-written here because this project is validated headlessly (see
; docs/GODOT_RUNTIME.md) and export had never been verified at all.
;
; Every key below was checked against the engine binary's own registered option
; names rather than copied from a tutorial; keys the engine defines but that are
; left at their defaults are deliberately omitted, because a preset that omits an
; option gets the engine's `get_export_options()` default. Inventing a key the
; engine does not register would be silently ignored, which is worse than absent.
;
; Reproduce an export with:
;   node scripts/fetch-godot.mjs                       # engine
;   node scripts/fetch-godot.mjs --export-templates    # matching 4.4-stable templates
;   .godot-runtime/bin/godot --headless --path world-lens-godot \
;       --export-release "Linux/X11" /tmp/world-lens.x86_64
;
; NOTE: `export_path` is intentionally empty. The CLI takes the output path as its
; final argument, and leaving it blank keeps a build artefact path out of version
; control. Supply the path on the command line.

[preset.0]

name="Linux/X11"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host=""
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; FIXED (audit 2026-07-27): was true, which requires SharedArrayBuffer --
; i.e. the server MUST send Cross-Origin-Opener-Policy: same-origin and
; Cross-Origin-Embedder-Policy: require-corp on every response that serves
; this bundle, or the build refuses to start in any browser at all
; (docs/GODOT_RUNTIME.md already documented this as a known blocker: "was
; never served or opened"). No infra in this repo emits those headers
; today. Flipped to false -- the fastest path to an actually-loadable
; browser build (single-threaded WASM, a real perf cost, but zero server
; header dependency). Flip back to true together with adding COOP/COEP
; headers wherever the bundle is served (see infra/cloudflare/ +
; nginx/conf.d/), not before.
variant/thread_support=false
vram_texture_compression/for_desktop=true
; FIXED (audit 2026-07-27): was false. Mobile browsers on WebGL2/
; Compatibility need ETC2/ASTC-compressed textures. Moot today (the
; project ships zero binary texture assets -- docs/GODOT_RUNTIME.md), but
; wrong the first time one lands; cheap to fix now before it's forgotten.
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
; progressive_web_app/enabled stays false (no PWA/offline story yet) --
; ensure_cross_origin_isolation_headers only takes effect through the PWA
; service worker, so it was previously inert (true while PWA was false).
; With thread_support now false above, cross-origin isolation isn't
; required at all, so this key is correctly a no-op either way; left as
; documentation of intent rather than removed.
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
