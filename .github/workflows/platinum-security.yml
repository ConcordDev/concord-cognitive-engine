name: Platinum Security (SAST + SCA + Secrets)

# Sprint 18 — full platinum-tier security gate. Runs on every PR.
#
# BATCHED ARCHITECTURE v2 (Sprint 35): matrix-with-shared-setup.
#
# The original shape ran 7 fully independent jobs (each one a cold
# VM, each one downloading actions, each one `npm ci`-ing). That
# pattern is what triggered GitHub's CDN 429 wave on
# `github/codeql-action/*` and similar.
#
# v1 (PR #340 first version) collapsed 4 npm-dependent gates into
# ONE sequential job — got the CDN savings but regressed per-gate
# PR visibility (one row "SCA + Supply Chain" hides which gate
# failed). Reviewer had to click through to log to find out.
#
# v2 (this version) keeps per-gate PR visibility via a matrix:
#
#   npm-deps-setup       — runs `npm ci` once for server + frontend,
#                          fills setup-node's npm cache for downstream
#                          (artifact-bundling node_modules would be a
#                          500 MB upload — too slow; cache is faster)
#   sca-scan (matrix)    — 4 parallel jobs: npm-audit, retire-js,
#                          licenses, sbom. Each is its own PR check-run
#                          row ("sca-scan (npm-audit)" etc) so failure
#                          is visible at-a-glance without log diving.
#
# Independent gates (no npm needed) stay in their own jobs:
#   - semgrep-sast    (container-based)
#   - secrets-scan    (gitleaks)
#   - container-scan  (docker + Trivy)
#
# Net per-merge effect vs original 7-job shape:
#   - VM provisions:    7 → 7 (matrix re-uses runners count, gains
#                              per-gate visibility back without
#                              re-introducing setup duplication)
#   - npm ci runs:      6 → 4 (cached on 4 matrix entries; first-time
#                              cache miss is fast via parallel hits)
#   - Action downloads: ~28 → ~22 (slight reduction; setup-node cache
#                                  hit avoids re-downloading deps)
#   - Per-gate PR rows: 7 → 7 (PRESERVED — point of v2)
#   - Concurrent runners: 7 → 6 max (setup blocks the matrix until done)
#   - Wall-clock: roughly equal, slightly faster on parallel scans

on:
  pull_request:
    paths:
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'server/migrations/**'
      - '.github/workflows/platinum-security.yml'
      - '.retireignore.json'
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    name: SAST — Semgrep (rules in .semgrep.yml)
    runs-on: ubuntu-latest
    # Run inside Semgrep's official container so the binary is on PATH
    # without needing pip/npm install gymnastics. Sprint 34 fix — the
    # prior `npm install -g semgrep@latest || pip install semgrep` shape
    # exited 127 (command not found) because neither install actually
    # produced a working binary on the runner.
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Semgrep SAST scan
        run: |
          # Phase 1: emit JSON output for the SARIF upload, never fail.
          semgrep --config=.semgrep.yml --severity=ERROR \
            --severity=WARNING --json --output=semgrep-results.json . || true
          # Phase 2: re-run with --error to fail the job on ERROR-tier hits only.
          # Warnings still flow to the JSON artifact but don't block CI.
          semgrep --config=.semgrep.yml --error --severity=ERROR .
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ════════════════════════════════════════════════════════════════════
  # Shared setup for npm-dependent gates (Sprint 35 v2)
  # Single source of truth for `npm ci` so the matrix doesn't redo it
  # from a cold cache. Subsequent matrix entries hit setup-node's npm
  # cache and pull from a warm tarball (~5-15s vs ~30-60s cold).
  # ════════════════════════════════════════════════════════════════════
  npm-deps-setup:
    name: SCA setup (npm ci server + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            concord-frontend/package-lock.json

      # --ignore-scripts: SCA scanners (npm audit, retire.js, license,
      # SBOM) read package metadata — they don't need postinstall scripts
      # to run. Skipping them avoids transient external-CDN failures
      # (e.g. ffmpeg-static fetching a release asset from GitHub) that
      # have no bearing on the security scan output.
      - name: Install server deps (primes cache)
        working-directory: ./server
        run: npm ci --prefer-offline --ignore-scripts

      - name: Install frontend deps (primes cache)
        working-directory: ./concord-frontend
        run: npm ci --prefer-offline --ignore-scripts

  # ════════════════════════════════════════════════════════════════════
  # Matrix-batched SCA + Supply Chain gates (Sprint 35 v2)
  # Each matrix entry is its own check-run in the PR UI:
  #   sca-scan (npm-audit-server)
  #   sca-scan (npm-audit-frontend)
  #   sca-scan (retire-js)
  #   sca-scan (licenses)
  #   sca-scan (sbom)
  # `fail-fast: false` lets the other gates finish even if one fails,
  # so reviewers see the full pattern of red/green at once.
  # ════════════════════════════════════════════════════════════════════
  sca-scan:
    name: ${{ matrix.scan.name }}
    needs: npm-deps-setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scan:
          - { id: npm-audit-server,   name: "SCA — npm audit (server)" }
          - { id: npm-audit-frontend, name: "SCA — npm audit (frontend)" }
          - { id: retire-js,          name: "SCA — retire.js" }
          - { id: licenses,           name: "Supply Chain — license compliance" }
          - { id: sbom,               name: "Supply Chain — SBOM generation" }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            concord-frontend/package-lock.json

      # All entries do `npm ci` — but the npm-deps-setup job already
      # primed setup-node's cache, so this is fast (~5-15s) instead of
      # the cold ~30-60s. Each matrix entry needs node_modules locally
      # because GitHub Actions doesn't share filesystems across jobs.
      # --ignore-scripts for the same reason as npm-deps-setup above:
      # SCA scanners read metadata, not built artifacts. Skipping
      # postinstall avoids transient external-CDN failures.
      - name: Install deps (cache-hit fast path)
        run: |
          cd server && npm ci --prefer-offline --ignore-scripts
          cd ../concord-frontend && npm ci --prefer-offline --ignore-scripts

      # ── Per-scan dispatcher ──────────────────────────────────────────
      - name: Run ${{ matrix.scan.id }}
        run: |
          set -e
          case "${{ matrix.scan.id }}" in

            npm-audit-server)
              cd server
              npm audit --production --audit-level=high
              ;;

            npm-audit-frontend)
              # FP-aware audit. See scripts/ci/check-frontend-audit.py
              # for the allowlist + audit rationale. Extracted to its
              # own file (Sprint 35 v2) because embedding multi-line
              # Python inside this YAML `run: |` block-scalar broke
              # under matrix nesting — YAML strips common leading
              # indent, leaving Python top-level statements indented
              # and rejected by the interpreter.
              cd concord-frontend
              set +e
              npm audit --omit=dev --json > audit.json
              set -e
              python3 ../scripts/ci/check-frontend-audit.py audit.json
              ;;

            retire-js)
              # retire.js scans both server + frontend node_modules for
              # known-vulnerable bundled JS libraries (signature match
              # on the bundled bytes, not just package.json versions).
              # .retireignore.json lives at repo root and allowlists
              # monaco-editor's bundled DOMPurify (full audit reason
              # in the file's justification field). Passing
              # --ignorefile explicitly so retire finds it regardless
              # of the cwd at scan time.
              npm install -g retire@latest
              IGNORE_FILE="$GITHUB_WORKSPACE/.retireignore.json"
              # Pass 1: never-fail report for visibility
              retire --severity high --ignorefile "$IGNORE_FILE" --path server || true
              retire --severity high --ignorefile "$IGNORE_FILE" --path concord-frontend || true
              # Pass 2: fail-mode for actual gating
              retire --severity high --exitwith 1 --ignorefile "$IGNORE_FILE" --path server
              retire --severity high --exitwith 1 --ignorefile "$IGNORE_FILE" --path concord-frontend
              ;;

            licenses)
              cd server
              npx license-checker --production --json \
                | node ../scripts/check-licenses.js ../.license-checker-allowlist.json
              cd ../concord-frontend
              npx license-checker --production --json \
                | node ../scripts/check-licenses.js ../.license-checker-allowlist.json
              ;;

            sbom)
              mkdir -p audit
              npx @cyclonedx/cyclonedx-npm --output-file audit/sbom.json . || true
              ;;

          esac

      - name: Upload SBOM
        if: always() && matrix.scan.id == 'sbom'
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: audit/sbom.json
          retention-days: 30

  secrets-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  container-scan:
    name: Container — Trivy image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    #
    # 2026-07-27 security triage: this job HAD NEVER SCANNED ANYTHING.
    #
    # It gated every step on `if [ -f Dockerfile ]` at the repo root, and no
    # root Dockerfile has ever existed — the real ones are server/Dockerfile
    # and concord-frontend/Dockerfile. So the check took the else branch on
    # every run, emitted `::notice::No Dockerfile at repo root`, and the job
    # went green without building or scanning an image, while the comment on
    # the Trivy step below described itself as "the actual CVE gate".
    #
    # This is the same silently-disarmed-gate failure mode that
    # scripts/autoloop/guard.mjs records as a past incident (a wrong
    # coin-service.js path left coin minting ungated). A gate whose skip path
    # is indistinguishable from a pass is worse than no gate, because it is
    # counted as coverage.
    #
    # Now a matrix over the two real images, each built from its own service
    # directory as build context — matching how docker-compose.yml builds them
    # (`context: ./server` / `context: ./concord-frontend`). Removing the
    # presence check entirely is deliberate: if a Dockerfile path stops
    # resolving, the build must FAIL loudly rather than skip quietly.
    #
    # 2026-07-30 — made non-blocking, per an explicit owner decision, NOT a
    # re-disarm of the bug above. The distinction: the bug above made the job
    # pass WITHOUT scanning anything — a false green. This still builds the
    # image, runs Trivy for real, and uploads findings to the Security tab
    # exactly as before; it simply no longer fails the PR when it finds a
    # fixable CRITICAL/HIGH CVE. Reason: this repo's actual production target
    # is bare-metal (pm2 + startup.sh, see CLAUDE.md), not Docker —
    # `server/Dockerfile` / `concord-frontend/Dockerfile` and
    # `docker-compose.yml` are a parallel, unshipped path (local dev / an
    # alternate operator's deployment choice). Blocking every PR on CVEs in
    # an image nobody runs in production is the same "ignored/disabled gate"
    # failure mode the Dockerfile's own `ignore-unfixed` comment warns about,
    # just from the other direction. If Docker ever becomes a real
    # deployment target, flip this back to blocking.
    #
    # IMPORTANT — this must be `continue-on-error` on the "Trivy scan" STEP,
    # not the job. Verified empirically: job-level `continue-on-error: true`
    # does NOT change the job's own reported `conclusion` — a required-status
    # check reads the per-job conclusion, so a job-level flag alone leaves
    # this failing exactly as before for anything that gates on the check
    # name. Step-level `continue-on-error` is what makes the JOB's overall
    # conclusion become success while the step itself still shows its real
    # failure in the log.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: server
          - name: frontend
            context: concord-frontend
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t "concord-${{ matrix.name }}:scan" "${{ matrix.context }}"
      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'concord-${{ matrix.name }}:scan'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          # Fail only on CVEs that HAVE a fix available.
          #
          # This is a scoping decision, not a softening, and the distinction
          # matters: `ignore-unfixed` cannot hide anything actionable, because
          # a CVE with an available fix STILL fails the job. It only stops the
          # gate failing on findings no change to this repository could
          # resolve.
          #
          # Grounded in two checks made 2026-07-28 rather than assumed:
          #   1. Both Dockerfiles digest-pin node:20-bookworm-slim, and
          #      querying Docker Hub returned that SAME digest as current —
          #      so the pin is not stale and there is no patched base to move
          #      to. Any remaining unfixed CVE is upstream Debian's to fix.
          #   2. Both images now run `apt-get upgrade` in their base stage
          #      (they did not before; the frontend had no apt step at all),
          #      so every fix that DOES exist is applied at build time.
          #
          # Without this, the gate is permanently red on CVEs nobody can act
          # on — which is precisely how a gate gets ignored or disabled, the
          # same failure mode that left this job scanning nothing for months.
          ignore-unfixed: true
          # `exit-code: 1` keeps THIS step the actual CVE gate — if
          # Trivy finds a fixable CRITICAL or HIGH-severity CVE this fails
          # the job. The SARIF upload step below is informational only.
          #
          # Known consequence, stated rather than glossed: the SARIF is
          # produced by THIS step, so it inherits `ignore-unfixed` and the
          # Security dashboard will no longer list unfixed CVEs either.
          # Surfacing those separately would need a second, non-gating Trivy
          # run with `ignore-unfixed: false` — deliberately not added here to
          # keep this change to one concern.
          exit-code: '1'
      - name: Upload Trivy SARIF
        # `continue-on-error: true` because this step downloads
        # `github/codeql-action/upload-sarif@v3` from GitHub's CDN,
        # which occasionally returns HTTP 429 (Too Many Requests) and
        # fails the entire job during "Set up job" phase — before any
        # of our scan logic runs. That's transient GitHub Actions
        # infrastructure noise, not a CVE finding. The Trivy scan step
        # above is the actual blocking CVE check; this step only
        # uploads results to GitHub's Security dashboard for
        # visualization, so a 429 here shouldn't gate merges.
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: 'trivy-results-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'
