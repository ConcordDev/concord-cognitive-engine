name: Deploy

on:
  push:
    branches: [main]
  # The `gate` job (lint, type-check, depth-honesty, the depth test suite,
  # security-detector ratchet) is the ONLY job that should also run here — a
  # regression could otherwise reach main via a merged PR with no CI having
  # ever run the depth suite against it, since this was previously the sole
  # workflow that runs it. `build-and-push`/`deploy-staging`/`deploy-production`
  # stay push/workflow_dispatch-only (see their own `if:` conditions below) so
  # a PR never builds+pushes an image or attempts a deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '20'
  # BACKEND_IMAGE/FRONTEND_IMAGE deliberately NOT defined here: Docker repository
  # names must be all-lowercase, but `github.repository_owner` for this repo is
  # "ConcordDev" (mixed case) and GitHub Actions expressions have no built-in
  # lowercase function. build-and-push's `vars` step computes the lowercased
  # owner via bash and exposes it as the `owner-lower` job output; every image
  # reference below is built from `${{ env.REGISTRY }}/${{ ...owner-lower }}/concord-{backend,frontend}`
  # instead of a workflow-level env var (which can't reference step outputs).

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # CI gate — a red commit MUST NOT build or deploy. This is the in-repo
  # backstop (H5); GitHub branch-protection required-status-checks (CI / Audits /
  # Detectors) is the authoritative gate and MUST also be enabled on `main` —
  # nothing in-repo can enforce that repo setting, and it's how a red main shipped
  # before. This job runs the fast, high-signal blocking checks (lint, type-check,
  # the depth-honesty gate, the depth test suite, and the security-detector ratchet),
  # and every downstream job `needs` it. It also includes the prophet-check build
  # gate (M5) that the frontend Docker image skips.
  gate:
    name: CI gate (block deploy on red)
    runs-on: ubuntu-latest
    # Job-level (not workflow-level) so this never leaks into build-and-push/
    # deploy-staging/deploy-production — those are real build/deploy
    # operations, not tests. Without this, tests/preload/no-egress.mjs's
    # NODE_ENV==='test' gate never engages here, so the depth suite's
    # network/LLM cases could reach the live network during this gate run
    # instead of skipping deterministically.
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # MUST be 22, not the workflow-wide NODE_VERSION (20): `node --test`
          # only expands glob-pattern file arguments (e.g. 'tests/depth/*.test.js'
          # below) on Node >= 21 — on Node 20 it fails immediately with
          # "Could not find '<literal glob string>'" instead of matching any
          # files. Same root cause + fix already applied in
          # .github/workflows/audits.yml's structural-audits job; this gate's
          # "Depth behavioral tests" step never got exercised on Node 20 until
          # now because a separate lint failure always short-circuited the job
          # first (fixed in the same PR that added this comment).
          node-version: '22'
      - name: Install server deps
        working-directory: ./server
        run: npm ci || (sleep 5 && npm ci) || (sleep 10 && npm ci)
      - name: Install frontend deps
        working-directory: ./concord-frontend
        run: npm ci || (sleep 5 && npm ci) || (sleep 10 && npm ci)
      - name: Server lint (0 warnings)
        working-directory: ./server
        run: npm run lint:ci
      - name: Frontend type-check
        working-directory: ./concord-frontend
        # type-check:ci (not the plain script) — tsc --noEmit OOM'd on a
        # standard runner at V8's default old-space limit (~4GB heap, exit
        # 134) before producing any diagnostic output; this is a runner-size
        # crash, not a real type error. Mirrors build:ci's existing
        # --max-old-space-size pattern in package.json.
        run: npm run type-check:ci
      - name: Prophet-check (build-blocker analysis — M5; skipped by the frontend image)
        working-directory: ./concord-frontend
        run: node ../server/scripts/prophet-check.js
      - name: Depth-honesty gate
        run: node scripts/check-depth-tests.mjs --ci
      - name: Depth behavioral tests
        working-directory: ./server
        # Run with the SAME invocation the depth tests were authored under
        # (docs/DEPTH_FLEET_PLAN.md "run recipe (mandatory preload)"), via
        # scripts/ci-test-tolerant.mjs --depth-only (test:depth:ci):
        # - tests/preload/no-egress.mjs — the suite's network/LLM cases skip
        #   under no-egress by design; without the preload they hit the live
        #   network on CI and fail nondeterministically (the 2026-07-04 run
        #   took 2h09m and failed 15/6000 with names that don't reproduce
        #   anywhere else, while the doctrine invocation finishes in ~10min
        #   deterministically).
        # - --test-timeout so a hung case fails fast instead of stalling the gate.
        # - isolated DB_PATH so the gate never touches a shared/stale DB file.
        # - --test-concurrency=2 to keep parallel server boots from OOM/SIGTRAP
        #   on smaller runners (one boot is ~550MB RSS).
        # - the ci-test-tolerant wrapper (already used by audits.yml for
        #   test:main/test:behavior) isolates-and-reruns any single-file SIGTRAP-
        #   under-load flake — confirmed by hand across 5+ distinct depth files
        #   (city-behavior, schemes-behavior, daily-behavior, research-behavior,
        #   security-access-audit-behavior) that fail ONLY under full concurrent
        #   load and pass clean every time alone; a real, reproducible failure
        #   still hard-fails the gate.
        run: npm run test:depth:ci
      - name: Security detector ratchet
        working-directory: ./server
        run: node scripts/run-detectors.js --consumer security --diff --ci

  # ═══════════════════════════════════════════════════════════════════════
  # Build Docker images and push to GitHub Container Registry
  # ═══════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push Images
    needs: [gate]
    # PRs should exercise `gate` (added above) but never build+push a
    # registry image — that stays push-to-main/workflow_dispatch-only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha-short: ${{ steps.vars.outputs.sha_short }}
      owner-lower: ${{ steps.vars.outputs.owner_lower }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Docker repository names must be lowercase; github.repository_owner
          # is "ConcordDev" (mixed case) for this repo and GitHub Actions
          # expressions have no built-in lowercase function.
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/concord-backend:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/concord-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./concord-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/concord-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/concord-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_API_URL=https://concord-os.org
            NEXT_PUBLIC_SOCKET_URL=https://concord-os.org
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy to staging (automatic on push to main)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://staging.concord-os.org
    # Deploy staging on push to main, or when manually triggered with staging.
    # ALSO gates on KUBE_CONFIG_STAGING being non-empty so the job skips
    # cleanly when the infra hasn't been provisioned yet (was failing every
    # main push with `secrets.KUBE_CONFIG_STAGING` empty → kubeconfig
    # decode silently produces an invalid file → kubectl auth fails).
    if: |
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
      && vars.STAGING_DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.sha-short }}
        run: |
          echo "Deploying to staging with image tag: $IMAGE_TAG"

          # Apply namespace and config first
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/network-policies.yaml

          # Apply deployments, then set the pinned image tag
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl set image deployment/concord-backend \
            backend="${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner-lower }}/concord-backend:${IMAGE_TAG}" \
            -n concord

          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl set image deployment/concord-frontend \
            frontend="${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner-lower }}/concord-frontend:${IMAGE_TAG}" \
            -n concord

          # Apply ingress, autoscaling, and backup
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/cronjob-backup.yaml

      - name: Wait for rollout
        run: |
          echo "Waiting for backend rollout..."
          kubectl rollout status deployment/concord-backend -n concord --timeout=300s

          echo "Waiting for frontend rollout..."
          kubectl rollout status deployment/concord-frontend -n concord --timeout=180s

      - name: Run smoke tests against staging
        run: |
          echo "Running smoke tests against staging..."

          # Wait for backend pods to be ready
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=concord-backend \
            -n concord --timeout=120s

          # Port-forward and run health checks
          kubectl port-forward svc/concord-backend 5050:5050 -n concord &
          PF_PID=$!
          sleep 5

          # Health check
          HEALTH=$(curl -sf http://localhost:5050/health 2>/dev/null || echo "FAIL")
          echo "Health check: $HEALTH"

          # Readiness check
          READY=$(curl -sf http://localhost:5050/ready 2>/dev/null || echo "FAIL")
          echo "Readiness check: $READY"

          kill $PF_PID 2>/dev/null || true

          if echo "$HEALTH" | grep -qi "fail"; then
            echo "Smoke test FAILED -- initiating rollback"
            kubectl rollout undo deployment/concord-backend -n concord
            kubectl rollout undo deployment/concord-frontend -n concord
            exit 1
          fi

          if echo "$READY" | grep -qi "fail"; then
            echo "Readiness check FAILED -- initiating rollback"
            kubectl rollout undo deployment/concord-backend -n concord
            kubectl rollout undo deployment/concord-frontend -n concord
            exit 1
          fi

          echo "Staging smoke tests passed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy failed -- rolling back staging..."
          kubectl rollout undo deployment/concord-backend -n concord || true
          kubectl rollout undo deployment/concord-frontend -n concord || true
          echo "Rollback complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy to production (manual approval required)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    # Only deploy to production when manually triggered with production
    # selected AND production deploy is explicitly enabled via repo var.
    # Mirrors the staging gate so neither deploy attempts to run with
    # missing infra.
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.environment == 'production'
      && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://concord-os.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Pre-deploy snapshot
        run: |
          echo "Recording current deployment state before production deploy..."

          BACKEND_REV=$(kubectl rollout history deployment/concord-backend -n concord 2>/dev/null \
            | tail -2 | head -1 | awk '{print $1}' || echo "0")
          FRONTEND_REV=$(kubectl rollout history deployment/concord-frontend -n concord 2>/dev/null \
            | tail -2 | head -1 | awk '{print $1}' || echo "0")

          echo "Current backend revision: $BACKEND_REV"
          echo "Current frontend revision: $FRONTEND_REV"
          echo "BACKEND_REV=$BACKEND_REV" >> "$GITHUB_ENV"
          echo "FRONTEND_REV=$FRONTEND_REV" >> "$GITHUB_ENV"

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.sha-short }}
        run: |
          echo "Deploying to PRODUCTION with image tag: $IMAGE_TAG"

          # Apply manifests (secrets are NOT applied -- managed externally in prod)
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/network-policies.yaml

          # Apply deployments then pin to the exact sha tag
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl set image deployment/concord-backend \
            backend="${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner-lower }}/concord-backend:${IMAGE_TAG}" \
            -n concord

          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl set image deployment/concord-frontend \
            frontend="${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner-lower }}/concord-frontend:${IMAGE_TAG}" \
            -n concord

          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/cronjob-backup.yaml

      - name: Wait for rollout
        run: |
          echo "Waiting for production backend rollout..."
          kubectl rollout status deployment/concord-backend -n concord --timeout=600s

          echo "Waiting for production frontend rollout..."
          kubectl rollout status deployment/concord-frontend -n concord --timeout=300s

      - name: Production health verification
        run: |
          echo "Verifying production health..."

          # Wait for all pods to be ready
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=concord-backend \
            -n concord --timeout=120s

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=concord-frontend \
            -n concord --timeout=120s

          # Port-forward and verify health
          kubectl port-forward svc/concord-backend 5050:5050 -n concord &
          PF_PID=$!
          sleep 5

          RETRIES=5
          HEALTH_OK=false
          for i in $(seq 1 $RETRIES); do
            HEALTH=$(curl -sf http://localhost:5050/health 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              echo "Health check passed on attempt $i"
              HEALTH_OK=true
              break
            fi
            echo "Health check attempt $i/$RETRIES failed, retrying..."
            sleep 5
          done

          kill $PF_PID 2>/dev/null || true

          if [ "$HEALTH_OK" = false ]; then
            echo "CRITICAL: Production health check failed after $RETRIES attempts"
            echo "Initiating automatic rollback..."
            exit 1
          fi

          echo "Production deploy verified successfully"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "PRODUCTION DEPLOY FAILED -- initiating rollback..."

          if [ -n "$BACKEND_REV" ] && [ "$BACKEND_REV" != "0" ]; then
            echo "Rolling back backend to revision $BACKEND_REV"
            kubectl rollout undo deployment/concord-backend -n concord \
              --to-revision="$BACKEND_REV"
          else
            echo "Rolling back backend to previous revision"
            kubectl rollout undo deployment/concord-backend -n concord
          fi

          if [ -n "$FRONTEND_REV" ] && [ "$FRONTEND_REV" != "0" ]; then
            echo "Rolling back frontend to revision $FRONTEND_REV"
            kubectl rollout undo deployment/concord-frontend -n concord \
              --to-revision="$FRONTEND_REV"
          else
            echo "Rolling back frontend to previous revision"
            kubectl rollout undo deployment/concord-frontend -n concord
          fi

          # Wait for rollback to complete
          kubectl rollout status deployment/concord-backend -n concord --timeout=300s || true
          kubectl rollout status deployment/concord-frontend -n concord --timeout=180s || true

          echo "Rollback complete. Please investigate the failure."
