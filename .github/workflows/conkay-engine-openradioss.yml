# CI lane for the openradioss engine (SXE-13, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-openradioss

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provision OpenRadioss 2025.09 (unmodified distribution + QA set) + driver env
        run: |
          echo "Provision the unmodified OpenRadioss 2025.09 Linux distribution and its QA decks per docs/conkay/engines/openradioss.md"
          ls "${CONKAY_OPENRADIOSS_HOME:-/opt/openradioss}" || true
          python3 -m venv /opt/concord-engines/openradioss
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_OPENRADIOSS_BIN: /opt/concord-engines/openradioss/bin/python
          CONKAY_OPENRADIOSS_HOME: /opt/openradioss
        run: |
          node --test server/tests/conkay/engines/openradioss.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
