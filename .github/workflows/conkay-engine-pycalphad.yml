# CI lane for the pycalphad engine (SXE-24, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-pycalphad

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pycalphad 0.11.0 (pinned) + open TDB
        run: |
          python3 -m venv /opt/concord-engines/pycalphad
          /opt/concord-engines/pycalphad/bin/pip install --no-cache-dir pycalphad==0.11.0
          git clone --depth 1 https://github.com/pycalphad/pycalphad /opt/concord-engines/pycalphad-src
          find /opt/concord-engines/pycalphad-src -iname "*al*zn*.tdb" -o -iname "*alzn*.tdb" | head -3
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_PYCALPHAD_BIN: /opt/concord-engines/pycalphad/bin/python
          CONKAY_PYCALPHAD_TDB: /opt/concord-engines/pycalphad/alzn.tdb
        run: |
          node --test server/tests/conkay/engines/pycalphad.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
