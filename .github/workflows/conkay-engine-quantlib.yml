# CI lane for the quantlib engine (SXE-23, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-quantlib

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install QuantLib-Python 1.40 (pinned)
        run: |
          python3 -m venv /opt/concord-engines/quantlib
          /opt/concord-engines/quantlib/bin/pip install --no-cache-dir QuantLib==1.40
          /opt/concord-engines/quantlib/bin/python -c "import QuantLib; print(QuantLib.__version__)"
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_QUANTLIB_BIN: /opt/concord-engines/quantlib/bin/python
        run: |
          node --test server/tests/conkay/engines/quantlib.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
