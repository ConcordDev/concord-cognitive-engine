# CI lane for the pinocchio engine (SXE-14, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-pinocchio

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: conda-incubator/setup-miniconda@v3
      - name: Install Pinocchio 3.3.0 (pinned, conda-forge)
        run: |
          conda create -y -p /opt/concord-engines/pinocchio -c conda-forge python=3.12 pinocchio=3.3.0
          /opt/concord-engines/pinocchio/bin/python -c "import pinocchio; print(pinocchio.__version__)"
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_PINOCCHIO_BIN: /opt/concord-engines/pinocchio/bin/python
        run: |
          node --test server/tests/conkay/engines/pinocchio.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
