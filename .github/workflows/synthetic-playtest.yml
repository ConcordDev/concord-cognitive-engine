name: synthetic-playtest

# Synthetic multi-day playtest — exercises the deep substrate (forward-sim,
# faction-strategy, NPC asymmetry) by compressing 7 in-game days into seconds.
# Runs nightly so substrate drift surfaces before real players do.
#
# Default-off in PR CI (the test file is gated by CONCORD_SYNTHETIC_PLAYTEST);
# this workflow flips the flag and runs it on a schedule.

# 2026-10-26 CI smoothing: heavy audit, moved off PRs/pushes to a nightly run
# plus manual dispatch. A failed scheduled/dispatched run opens or updates a
# tracking issue (nightly-failure-issue.yml) instead of blocking PRs.
on:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

# Least-privilege token scope. Without this the workflow inherits the
# repository default, which is broader than anything here needs: these
# jobs only check out code and upload artifacts -- no GITHUB_TOKEN use,
# no gh CLI, no SARIF upload, no PR/issue writes, no pushes.
permissions:
  contents: read

# One group per workflow per PR, or per ref for push/schedule/dispatch.
# A newer pull_request run cancels the older in-flight run. Push, schedule,
# and workflow_dispatch do not: an in-progress main deploy or publish is
# left to finish. GitHub still drops older queued runs in the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run synthetic playtest (CONCORD_SYNTHETIC_PLAYTEST=1)
        working-directory: ./server
        env:
          CONCORD_SYNTHETIC_PLAYTEST: '1'
          CONCORD_FORWARD_SIM_MIN_INTERVAL_S: '1'
          NODE_ENV: test
        run: node --test --test-timeout=600000 tests/synthetic-playtest.test.js

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-playtest-trace
          path: |
            server/playtest-*.log
            /tmp/prophet-check-error.log
          if-no-files-found: ignore
