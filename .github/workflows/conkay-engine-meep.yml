# CI lane for the meep engine (SXE-18, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-meep

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: conda-incubator/setup-miniconda@v3
      - name: Install Meep 1.31.0 (pinned, conda-forge pymeep)
        run: |
          conda create -y -p /opt/concord-engines/meep -c conda-forge python=3.12 pymeep=1.31.0
          /opt/concord-engines/meep/bin/python -c "import meep; print(meep.__version__)"
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_MEEP_BIN: /opt/concord-engines/meep/bin/python
        run: |
          node --test server/tests/conkay/engines/meep.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
