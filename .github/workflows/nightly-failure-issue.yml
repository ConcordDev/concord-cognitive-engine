name: Nightly failure issue

# Heavy audits run nightly (schedule) or on demand (workflow_dispatch) instead
# of on every PR. When one of those runs fails, open a tracking issue (or add a
# comment to the open one) so the failure is visible without blocking PRs.
# A later successful run comments and closes the issue.
on:
  workflow_run:
    workflows:
      - "Adversarial Audit — composite gate"
      - "audits"
      - "Platinum Security (SAST + SCA + Secrets)"
      - "Detectors + Cartography — Perception Layer"
      - "Platinum Performance (Lighthouse + bundle size + load)"
      - "Platinum Visual Regression"
      - "Lighthouse CI"
      - "Security Detectors — PR Gate (blocking)"
      - "Playthrough (Phase Z)"
      - "synthetic-journey"
      - "synthetic-playtest"
      - "Platinum DAST (OWASP ZAP)"
      - "CI"
    types: [completed]

permissions:
  issues: write
  actions: read

concurrency:
  group: nightly-failure-issue-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
      && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          title="Nightly: ${WF_NAME} failing"
          gh label create nightly-failure --color B60205 --description "Scheduled audit failed" 2>/dev/null || true
          num=$(gh issue list --state open --label nightly-failure --search "\"${title}\" in:title" --json number,title \
                  --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ "$CONCLUSION" = "failure" ]; then
            body="Run failed (${EVENT}) on ${HEAD_SHA:0:9}: ${RUN_URL}"
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "$body"
            else
              gh issue create --title "$title" --label nightly-failure \
                --body "${body}

          This audit runs nightly instead of on every PR. Fix the failure or ratchet the baseline with a reason. A later passing run closes this issue."
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "Passing again (${EVENT}) on ${HEAD_SHA:0:9}: ${RUN_URL}"
            gh issue close "$num"
          fi
