# CI lane for the code-aster engine (SXE-08, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-code-aster

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provision Code_Aster 17.4.0 (container env) + driver env
        run: |
          echo "Provision the Code_Aster 17.4.0 container image's env per docs/conkay/engines/code-aster.md (the lane runs inside that image)"
          which run_aster || which codeaster || true
          python3 -m venv /opt/concord-engines/code-aster
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_CODE_ASTER_BIN: /opt/concord-engines/code-aster/bin/python
        run: |
          node --test server/tests/conkay/engines/code-aster.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
