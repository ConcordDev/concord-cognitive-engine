# CI lane for the acados engine (SXE-20, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-acados

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install acados 0.5.0 (pinned) + template
        run: |
          echo "Build/install acados 0.5.0 and its Python template per docs/conkay/engines/acados.md (needs a C compiler + the acados shared libraries)"
          python3 -m venv /opt/concord-engines/acados
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_ACADOS_BIN: /opt/concord-engines/acados/bin/python
        run: |
          node --test server/tests/conkay/engines/acados.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
