# CI lane for the ngspice engine (SXE-16, built under SXE-53).
#
# Heavy-engine lane: MANUAL DISPATCH ONLY per the founder F8
# ruling (2026-11-18) — no automatic schedule until the founder
# approves one as a spend decision. Lands via the desk git route
# (the GitHub connector cannot write workflow files).
name: conkay-engine-ngspice

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ngspice (distro package) + driver env
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version || ngspice -v || true
          python3 -m venv /opt/concord-engines/ngspice
      - name: Run engine tests (skips fail the lane)
        env:
          CONKAY_ENGINE_NGSPICE_BIN: /opt/concord-engines/ngspice/bin/python
        run: |
          node --test server/tests/conkay/engines/ngspice.test.js 2>&1 | tee /tmp/engine-tests.log
          grep -q "ℹ skipped 0" /tmp/engine-tests.log
