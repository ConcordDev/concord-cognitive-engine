[package]
name = "concord-shell-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure process-lifecycle state machine for the Concord desktop shell (Tauri). Zero I/O, zero OS-process, zero GUI dependency by design -- unit-testable with plain `cargo test` in any environment, including headless CI containers with no display and no webview libraries."

[dependencies]
# serde is the only dependency, and it is itself pure-Rust with no system
# library linkage -- it does not compromise the "testable anywhere" property.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Test-only, used to prove the serde wire shape round-trips (also pure Rust,
# no system library linkage).
serde_json = "1"
