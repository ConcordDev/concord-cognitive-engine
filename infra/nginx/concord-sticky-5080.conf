# Live Mac fragment installed at /opt/homebrew/etc/nginx/servers/concord-sticky.conf
# See sticky-sessions.conf.example for the sticky-cookie variant (needs nginx sticky module).
# This file uses ip_hash because Homebrew nginx/1.31.5 has no sticky module.

upstream concord_sticky {
    ip_hash;
    server 127.0.0.1:5050;
    server 127.0.0.1:5051;
    keepalive 16;
}

upstream concord_rr {
    server 127.0.0.1:5050;
    server 127.0.0.1:5051;
    keepalive 8;
}

server {
    listen 127.0.0.1:5080;
    server_name localhost;
    add_header X-Concord-Upstream $upstream_addr always;
    add_header X-Concord-Upstream-Status $upstream_status always;

    location = /health {
        proxy_pass http://concord_rr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://concord_rr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location /socket.io/ {
        proxy_pass http://concord_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # Next and location / with Connection "" do not forward WebSocket
    # upgrades. Unity WebGL / Godot must hit these the same way as /socket.io/.
    location /unity-ws {
        proxy_pass http://concord_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /godot-ws {
        proxy_pass http://concord_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /api/chat/ {
        proxy_pass http://concord_sticky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://concord_sticky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
